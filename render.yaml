services:
  - type: web
    name: studyai-ghana
    runtime: docker
    dockerfilePath: Dockerfile
    port: 8080
    healthCheckPath: /health
    startCommand: bash start.sh
    envVars:
      - key: BOT_MODE
        value: webhook
      - key: DATABASE_URL
        fromDatabase:
          name: studyai-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_KEY
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_TELEGRAM_IDS
        value: "571327537"
      - key: BOT_USERNAME
        value: StudyAiGHbot
      - key: LOG_LEVEL
        value: INFO
      - key: FREE_AI_DAILY_LIMIT
        value: "20"
      - key: FREE_QUIZ_DAILY_LIMIT
        value: "3"
      - key: FREE_EXAMS_DAILY_LIMIT
        value: "1"

  - type: postgresql
    name: studyai-db
    database: studyai
    plan: free
    ipAllowList: []
